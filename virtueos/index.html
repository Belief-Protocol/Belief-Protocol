<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2540" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VirtueOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topchrome" aria-label="VirtueOS reader">
        <div class="brand">
          <span class="brand-mark">VirtueOS</span>
          <span class="brand-app">Reader</span>
        </div>
        <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      </header>

      <main id="feed" class="feed" tabindex="0" aria-label="Pathway feed"></main>

      <aside class="rail" aria-label="Card actions">
        <button type="button" class="rail-btn" data-action="save" title="Save">
          <span class="rail-icon" aria-hidden="true">＋</span>
          <span>Save</span>
        </button>
        <button type="button" class="rail-btn" data-action="note" title="Note">
          <span class="rail-icon" aria-hidden="true">✎</span>
          <span>Note</span>
        </button>
        <button type="button" class="rail-btn" data-action="share" title="Share">
          <span class="rail-icon" aria-hidden="true">↗</span>
          <span>Share</span>
        </button>
      </aside>

      <div id="toast" class="toast" hidden></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
